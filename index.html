<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>HORIZON OS v2.1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #000;
      color: #00ff00;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 15px;
      height: 100%;
      overflow: hidden;
    }
    #matrix-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1; opacity: 0.28;
    }
    #terminal {
      position: relative; z-index: 2;
      width: 100%; height: 100vh;
      overflow: hidden; display: flex;
      flex-direction: column; background: transparent;
      transition: color 0.25s;
    }
    #output {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      white-space: pre-wrap; padding: 18px 22px 8px; color: inherit;
    }
    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-track { background: transparent; }
    #output::-webkit-scrollbar-thumb { background: #00ff0033; border-radius: 2px; }
    #input { position: fixed; top: -9999px; opacity: 0; width: 1px; height: 1px; }
    #input-line {
      padding: 5px 22px 14px; font-size: inherit;
      font-family: inherit; color: inherit; flex-shrink: 0;
    }
    #typed { white-space: pre; }
    #fake-cursor {
      display: inline-block; width: 9px; height: 1.05em;
      background-color: currentColor; margin-left: 1px;
      vertical-align: bottom; animation: cur-blink 1s step-end infinite;
    }
    @keyframes cur-blink { 50% { opacity: 0; } }
    .terminal-line { margin: 1px 0; line-height: 1.5; }
    #flicker-center {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; white-space: pre; z-index: 9999; color: lime;
    }
    .ascii-center {
      display: flex; flex-direction: column;
      align-items: center; text-align: center; margin: 1rem 0; line-height: 1.4;
    }
    .ascii-center pre { margin: 0; }

    /* Center menu screens without centering the terminal text itself.
       Each menu line keeps left-aligned monospace columns inside a centered block. */
    .terminal-line.menu-line {
      width: min(var(--menu-width, 72ch), calc(100vw - 44px));
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    /* Operator Mode */
    #terminal.operator,
    #terminal.operator #output,
    #terminal.operator #input-line { color: #00ffff !important; }
    #terminal.operator #fake-cursor { background-color: #00ffff !important; }
    .op-label { color: #00ffff !important; font-weight: bold; letter-spacing: 1px; }
    .scanlines {
      pointer-events: none; position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 99; opacity: 0.09;
      background: repeating-linear-gradient(to bottom, #00ffff 0px, #00ffff 1px, transparent 1px, transparent 5px);
      animation: scan-move 2s linear infinite;
    }
    @keyframes scan-move { 100% { background-position-y: 5px; } }
    /* Mayberry Mode */
    #terminal.mayberry-mode { background: #fff !important; color: #b30000 !important; }
    #terminal.mayberry-mode #output,
    #terminal.mayberry-mode #input-line { color: #b30000 !important; background: #fff; }
    #terminal.mayberry-mode #fake-cursor { background-color: #b30000 !important; }
    .tv-static-overlay {
      position: absolute; z-index: 200; left: 0; top: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, #fff 0px, #fff 2px, #eee 2px, #eee 4px);
      opacity: 0.55; animation: static-flk 0.14s infinite steps(2);
    }
    @keyframes static-flk { 0% { opacity: 0.28; } 100% { opacity: 0.55; } }
    .mayberry-flash {
      position: absolute; left: 0; right: 0; top: 33%;
      text-align: center; font-size: 2.8em; color: #b30000;
      font-weight: bold; z-index: 210; animation: may-flk 0.22s steps(2) 10;
    }
    .mayberry-opie { display: block; font-size: 0.65em; letter-spacing: 0.12em; margin-top: 0.2em; }

    @keyframes may-flk { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* ── Mayberry CRT phosphor burn ── */
    #terminal.mayberry-mode::after {
      content: '';
      pointer-events: none;
      position: fixed; top:0;left:0;width:100vw;height:100vh;
      z-index: 101;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(179,0,0,0.18) 100%);
      animation: may-phosphor 4s ease-in-out infinite alternate;
    }
    @keyframes may-phosphor {
      0%   { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* ── Mayberry red scanlines ── */
    .mayberry-scanlines {
      pointer-events: none; position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 102; opacity: 0.07;
      background: repeating-linear-gradient(to bottom, #b30000 0px, #b30000 1px, transparent 1px, transparent 4px);
      animation: may-scan 3s linear infinite;
    }
    @keyframes may-scan { 100% { background-position-y: 4px; } }

    /* ── Channel interference (green terminal bleed) ── */
    .may-interference {
      pointer-events: none; position: fixed;
      top:0;left:0;width:100vw;height:100vh;
      z-index: 300;
      background: #000;
      opacity: 0;
      mix-blend-mode: screen;
    }
    @keyframes may-glitch-band {
      0%   { opacity:0; clip-path: inset(100% 0 0 0); }
      10%  { opacity:0.85; clip-path: inset(30% 0 55% 0); }
      14%  { opacity:0; clip-path: inset(30% 0 55% 0); }
      15%  { opacity:0.6; clip-path: inset(65% 0 20% 0); }
      18%  { opacity:0; clip-path: inset(65% 0 20% 0); }
      100% { opacity:0; }
    }
    .may-interference.firing { animation: may-glitch-band 0.22s steps(2) forwards; }

    /* ── VHS warble on exit ── */
    @keyframes vhs-warble {
      0%   { filter: none; }
      20%  { filter: hue-rotate(180deg) saturate(3) brightness(1.4); transform: scaleX(1.015); }
      40%  { filter: hue-rotate(90deg) saturate(0) brightness(0.7); transform: scaleX(0.99) skewX(1deg); }
      60%  { filter: hue-rotate(270deg) saturate(4) brightness(1.2); transform: scaleX(1.01); }
      80%  { filter: saturate(0) brightness(0.5); transform: scaleX(1); }
      100% { filter: none; transform: none; }
    }
    #terminal.vhs-exit { animation: vhs-warble 0.55s ease-out forwards; }

    /* ── Mayberry player overlay ── */
    #mayberry-player {
      display: none;
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 500;
      width: min(560px, 94vw);
      background: #000;
      box-shadow: 0 0 40px #000c;
    }
    #mayberry-player.visible { display: block; }
    #mayberry-player iframe {
      display: block; width: 100%; aspect-ratio: 16/9; border: none;
    }
    #mayberry-player-close {
      display: block; width: 100%; padding: 5px 0;
      background: #111; color: #555; font-family: monospace;
      font-size: 0.7em; letter-spacing: 2px; text-align: center;
      cursor: pointer; border: none;
    }
    #mayberry-player-close:hover { color: #b30000; }

    /* NPC / special lines */
    .hughes-haunt { color: #ff4444 !important; font-style: italic; }
    .guardian-msg  { color: #7dcfff !important; }
    .signal-bleed  { color: #888 !important; font-size: 0.88em; }
    .uplink-line   { color: #39ff14; font-size: 0.82em; }
    .cicada-text   { color: #3165f2; font-weight: bold; }
    .tune-wave     { color: #00ffaa; font-family: monospace; letter-spacing: 1px; }
    .tune-hidden   { color: #005533; }
    .hh-type { color: #cc2200 !important; font-style: italic; letter-spacing: 0.3px; }
    #fake-cursor.hh-active { background-color: #cc2200 !important; animation: hh-pulse 0.4s step-end infinite; }
    @keyframes hh-pulse { 0%,49%{opacity:1;} 50%,100%{opacity:0.2;} }
    .load-bar      { white-space: pre; }
    #terminal.mayberry-mode .hughes-haunt,
    #terminal.mayberry-mode .guardian-msg { color: #b30000 !important; }


    /* Mobile polish */
    @media (max-width: 600px) {
      html, body { font-size: 13px; }
      #output { padding: 10px 10px 4px; }
      #input-line { padding: 4px 10px 10px; font-size: 13px; }
      #desk-overlay { font-size: 10px; }
      table { font-size: 10px; }
    }

    /* Desk fixed overlay */
    #desk-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 48px;
      z-index: 50;
      background: #000000;
      isolation: isolate;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 22px 12px;
      font-size: 12px;
      color: #ffcc44;
      font-family: 'Consolas','Monaco','Courier New',monospace;
      display: none;
    }
    #desk-overlay.active { display: block; background: #000 !important; }
    #terminal.desk-mode #output { visibility: hidden; }
    #terminal.desk-mode #input-line {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #000; border-top: 1px solid #333;
      padding: 8px 22px; z-index: 51;
    }

    /* Input stays above keyboard on mobile */
    #input-line { position: sticky; bottom: 0; background: #000; z-index: 10; }

    /* Login mode — prompt flows inline right under the banner */
    #terminal.login-mode #output { flex: 0 0 auto; overflow-y: visible; }
    #terminal.login-mode #input-line { position: relative !important; bottom: auto !important; background: transparent !important; }
    #terminal.mayberry-mode #input-line { background: #fff; }
    /* ── CRT vignette ── */
    #terminal::before {
      content: '';
      pointer-events: none;
      position: fixed; top:0;left:0;width:100vw;height:100vh;
      z-index: 100;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
    }

    /* ── Mode cursor colors ── */
    #terminal.operator    #fake-cursor { background-color: #00ffff !important; width:9px; }
    #terminal.mayberry-mode #fake-cursor { background-color: #b30000 !important; width:9px; }
    #terminal.hh-mode     #fake-cursor { background-color: #cc2200 !important; width:14px !important; animation: hh-pulse 0.35s step-end infinite !important; }
    #terminal.desk-mode   #fake-cursor { background-color: #ffaa00 !important; width:9px; animation: desk-blink 0.7s step-end infinite; }
    @keyframes desk-blink { 0%,49%{opacity:1;} 50%,100%{opacity:0.3;} }

    /* ── Input border by mode ── */
    #input-line { border-left: 2px solid transparent; transition: border-color 0.3s; padding-left: 8px; }
    #terminal.operator    #input-line { border-left-color: #00ffff44; }
    #terminal.hh-mode     #input-line { border-left-color: #cc220066; }
    #terminal.desk-mode   #input-line { border-left-color: #ffaa0044; }
    #terminal.mayberry-mode #input-line { border-left-color: #b3000044; }

    /* ── Desk amber tint ── */
    #terminal.desk-mode,
    #terminal.desk-mode #output,
    #terminal.desk-mode #input-line { color: #ffcc44 !important; }
    #terminal.desk-mode #fake-cursor { background-color: #ffaa00 !important; }
    #terminal.desk-mode .terminal-line { color: #ffcc44; }

    /* ── HH border pulse ── */
    @keyframes hh-border-pulse {
      0%   { box-shadow: inset 0 0 0 1px #cc220000; }
      50%  { box-shadow: inset 0 0 0 1px #cc220088; }
      100% { box-shadow: inset 0 0 0 1px #cc220000; }
    }
    #terminal.hh-speaking { animation: hh-border-pulse 0.6s ease-out; }

    /* ── Screen flicker ── */
    @keyframes screen-flicker {
      0%   { opacity: 1; }
      15%  { opacity: 0.85; }
      16%  { opacity: 1; }
      60%  { opacity: 1; }
      61%  { opacity: 0.9; }
      62%  { opacity: 1; }
      100% { opacity: 1; }
    }
    #terminal.flickering { animation: screen-flicker 0.12s linear; }

    /* ── Operator mode transition wash ── */
    #op-wash {
      position: fixed; top:0;left:0;width:100vw;height:100vh;
      background: #00ffff;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
    }

    /* ── Mayberry channel-change ── */
    @keyframes channel-h-collapse {
      0%   { transform: scaleY(1); opacity:1; }
      40%  { transform: scaleY(0.04); opacity:0.8; }
      60%  { transform: scaleY(0.04); opacity:0.8; }
      100% { transform: scaleY(1); opacity:1; }
    }
    #terminal.channel-change { animation: channel-h-collapse 0.5s ease-in-out; }

    /* ── HH disconnect signal loss ── */
    @keyframes signal-loss {
      0%   { filter: none; }
      20%  { filter: blur(1px) brightness(1.4); }
      40%  { filter: blur(2px) brightness(0.6) saturate(0); }
      60%  { filter: blur(1px) brightness(1.2); }
      80%  { filter: blur(0.5px) brightness(0.8); }
      100% { filter: none; }
    }
    #terminal.signal-loss { animation: signal-loss 0.7s ease-out; }

    /* ── Desk exit collapse ── */
    @keyframes desk-collapse {
      0%   { max-height: 100vh; opacity:1; }
      40%  { max-height: 4px; opacity:0.5; }
      60%  { max-height: 4px; opacity:0.5; }
      100% { max-height: 100vh; opacity:1; }
    }
    #terminal.desk-collapsing { animation: desk-collapse 0.4s ease-in-out; }

    /* ── Glitch character overlay ── */
    .glitch-char { display:inline; color: inherit; }
    .glitch-char.active { color: #ff0 !important; }

    /* ── Scanline reveal (for blackfile cats) ── */
    @keyframes scanline-reveal {
      from { clip-path: inset(0 0 100% 0); }
      to   { clip-path: inset(0 0 0% 0); }
    }
    .scanline-reveal { animation: scanline-reveal 0.6s linear forwards; }

    /* ── LIVE blink for desk ── */
    @keyframes live-blink { 0%,49%{opacity:1;color:#ff4400;} 50%,100%{opacity:0.3;} }
    .live-indicator { animation: live-blink 1s step-end infinite; font-weight:bold; }

    /* ── Desk row flash ── */
    @keyframes row-up   { 0%{background:#003300;} 100%{background:transparent;} }
    @keyframes row-down { 0%{background:#330000;} 100%{background:transparent;} }
    .row-flash-up   { animation: row-up   0.6s ease-out; }
    .row-flash-down { animation: row-down 0.6s ease-out; }

    /* ── Secondary matrix layer ── */
    #matrix-canvas-2 {
      position: fixed; top:0;left:0;width:100vw;height:100vh;
      pointer-events:none; z-index:0; opacity:0.10;
    }

    /* ── Late-session corruption on HH lines ── */
    .hh-corrupt { letter-spacing: 0.5px; opacity: 0.85; }


    /* ── HH Uplink apparition background ── */
    #hh-uplink-bg {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0.9s ease;
      mix-blend-mode: screen;
    }
    #hh-uplink-bg.active {
      opacity: 1;
      visibility: visible;
    }
    #hh-uplink-face {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(78vh, 72vw, 880px);
      max-width: 96vw;
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.30;
      filter:
        drop-shadow(0 0 10px rgba(0,255,0,0.45))
        drop-shadow(0 0 26px rgba(0,255,0,0.24))
        drop-shadow(0 0 54px rgba(0,255,0,0.12))
        blur(0.15px);
      animation:
        hh-face-drift 18s ease-in-out infinite alternate,
        hh-face-pulse 7.5s ease-in-out infinite,
        hh-face-flicker 0.28s steps(2) infinite;
      will-change: transform, opacity, filter;
      user-select: none;
    }
    #hh-uplink-face.speaking {
      opacity: 0.30 !important;
      filter:
        drop-shadow(0 0 16px rgba(0,255,0,0.70))
        drop-shadow(0 0 38px rgba(0,255,0,0.38))
        drop-shadow(0 0 76px rgba(0,255,0,0.18))
        blur(0.1px) !important;
      transition: opacity 0.16s ease, filter 0.16s ease;
    }
    #hh-uplink-face.glitching {
      animation:
        hh-face-drift 18s ease-in-out infinite alternate,
        hh-face-pulse 7.5s ease-in-out infinite,
        hh-face-flicker 0.12s steps(2) infinite,
        hh-face-jump 0.18s steps(2) 1;
    }
    .hh-uplink-scanlines,
    .hh-uplink-noise,
    .hh-uplink-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hh-uplink-scanlines {
      z-index: 2;
      opacity: 0.16;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.050) 0px,
        rgba(0,255,0,0.050) 1px,
        transparent 1px,
        transparent 5px
      );
      animation: hh-uplink-scan 3.8s linear infinite;
      mix-blend-mode: screen;
    }
    .hh-uplink-noise {
      z-index: 3;
      opacity: 0.10;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,255,0,0.08) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 60%, rgba(0,255,0,0.06) 0 1px, transparent 1px),
        radial-gradient(circle at 45% 85%, rgba(0,255,0,0.05) 0 1px, transparent 1px);
      background-size: 7px 7px, 11px 11px, 17px 17px;
      animation: hh-uplink-noise 0.5s steps(2) infinite;
      mix-blend-mode: screen;
    }
    .hh-uplink-vignette {
      z-index: 4;
      background:
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.58) 78%, rgba(0,0,0,0.88) 100%),
        radial-gradient(ellipse at center, rgba(0,255,0,0.08) 0%, transparent 58%);
      opacity: 0.90;
    }
    #terminal.hh-mode #output,
    #terminal.hh-mode #input-line {
      position: relative;
      z-index: 6;
      text-shadow: 0 0 8px rgba(204,34,0,0.30), 0 0 14px rgba(0,255,0,0.13);
    }
    #terminal.hh-mode #output {
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.25) 80%);
    }
    @keyframes hh-face-drift {
      0%   { transform: translate(-50%, -50%) scale(1.000) translate3d(-10px,  4px, 0); }
      24%  { transform: translate(-50%, -50%) scale(1.012) translate3d(  6px, -7px, 0); }
      51%  { transform: translate(-50%, -50%) scale(1.020) translate3d( -2px,  8px, 0); }
      77%  { transform: translate(-50%, -50%) scale(1.010) translate3d(  9px,  2px, 0); }
      100% { transform: translate(-50%, -50%) scale(1.026) translate3d( -7px, -5px, 0); }
    }
    @keyframes hh-face-pulse {
      0%   { opacity: 0.22; }
      38%  { opacity: 0.30; }
      52%  { opacity: 0.38; }
      71%  { opacity: 0.27; }
      100% { opacity: 0.24; }
    }
    @keyframes hh-face-flicker {
      0%   { filter: drop-shadow(0 0 10px rgba(0,255,0,0.45)) drop-shadow(0 0 26px rgba(0,255,0,0.24)) drop-shadow(0 0 54px rgba(0,255,0,0.12)) blur(0.15px); }
      50%  { filter: drop-shadow(0 0 7px rgba(0,255,0,0.34)) drop-shadow(0 0 18px rgba(0,255,0,0.20)) drop-shadow(0 0 42px rgba(0,255,0,0.10)) blur(0.32px); }
      100% { filter: drop-shadow(0 0 12px rgba(0,255,0,0.50)) drop-shadow(0 0 30px rgba(0,255,0,0.25)) drop-shadow(0 0 58px rgba(0,255,0,0.13)) blur(0.12px); }
    }
    @keyframes hh-face-jump {
      0%   { clip-path: inset(0 0 0 0); }
      33%  { clip-path: inset(7% 0 74% 0); transform: translate(-50%, -50%) scale(1.018) translate3d(9px, -2px, 0); }
      66%  { clip-path: inset(62% 0 19% 0); transform: translate(-50%, -50%) scale(1.010) translate3d(-8px, 3px, 0); }
      100% { clip-path: inset(0 0 0 0); }
    }
    @keyframes hh-uplink-scan { 100% { background-position-y: 10px; } }
    @keyframes hh-uplink-noise {
      0%   { transform: translate3d(0,0,0); opacity:0.07; }
      50%  { transform: translate3d(1px,-1px,0); opacity:0.13; }
      100% { transform: translate3d(-1px,1px,0); opacity:0.09; }
    }
    @media (max-width: 600px) {
      #hh-uplink-face {
        width: min(88vh, 110vw, 760px);
        opacity: 0.26;
      }
    }

    /* ── HH visual hardening patch ───────────────────────────── */
    #terminal.hh-mode::before {
      z-index: 2;
    }
    #terminal.hh-mode #hh-uplink-bg {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: block;
      background: radial-gradient(ellipse at center, rgba(0,255,0,0.035) 0%, transparent 58%, rgba(0,0,0,0.28) 100%);
    }
    #terminal.hh-mode #hh-uplink-bg.active {
      opacity: 1 !important;
      visibility: visible !important;
    }
    #terminal.hh-mode #hh-uplink-face {
      opacity: 0.46;
    }
    #terminal.hh-mode #output,
    #terminal.hh-mode #input-line {
      position: relative;
      z-index: 7;
    }
    #hh-uplink-bg.no-image::before {
      content: 'HH VISUAL CARRIER // IMAGE NOT FOUND';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0,255,0,0.32);
      font-size: 15px;
      letter-spacing: 0.18em;
      text-shadow: 0 0 18px rgba(0,255,0,0.35);
      white-space: nowrap;
    }

    /* ── HH matrix layering patch: rain stays behind the face ── */
    #terminal.hh-mode ~ #matrix-canvas { z-index: 1; }
    body:has(#terminal.hh-mode) #matrix-canvas {
      display: block !important;
      opacity: 0.22 !important;
      z-index: 1 !important;
    }
    body:has(#terminal.hh-mode) #matrix-canvas-2 {
      display: block !important;
      opacity: 0.10 !important;
      z-index: 0 !important;
    }

  </style>

// ── Print Queue (typewriter effect) ───────────────────────────
const pQueue = [];
let pBusy    = false;
let promptPending = null;
let menuLineWidth = null;

function printLine(html, cls, instant) {
  const lineClass = cls || '';
  if (lineClass.includes('hughes-haunt') || lineClass.includes('hh-type')) hhSpeakBoost();
  const menuWidth = lineClass.includes('menu-line') ? menuLineWidth : null;
  pQueue.push({ html, cls: lineClass, instant: !!instant, menuWidth });
  if (!pBusy) drainPQueue();
}
function printText(text, instant) {
  String(text).split('\n').forEach(l => printLine(esc(l), '', instant));
}
function printMenuLines(lines, cls) {
  const arr = Array.isArray(lines) ? lines : String(lines).split('\n');
  const prevWidth = menuLineWidth;
  menuLineWidth = Math.max(1, ...arr.map(l => String(l).length));
  arr.forEach(l => printLine(esc(l), cls ? 'menu-line ' + cls : 'menu-line', true));
  menuLineWidth = prevWidth;
}
function drainPQueue() {
  if (pQueue.length === 0) {
    pBusy = false;
    if (promptPending !== null) {
      _showPromptNow(promptPending);
      promptPending = null;
    }
    return;
  }
  pBusy = true;
  const { html, cls, instant, menuWidth } = pQueue.shift();
  const d = document.createElement('div');
  d.className = 'terminal-line' + (cls ? ' ' + cls : '');
  if (menuWidth) d.style.setProperty('--menu-width', menuWidth + 'ch');
  output.appendChild(d);
  scrollBot();
  if (output.querySelectorAll('.terminal-line').length > 700) capOutput();

  if (instant || html.indexOf('<') !== -1) {
    // Instant: HTML content or flagged instant
    d.innerHTML = html;
    scrollBot();
    setTimeout(drainPQueue, instant ? 0 : 30);
  } else {
    // Typewriter: plain text, char by char if short, else fast
    const text = html; // already esc'd plain text
    const speed = text.length < 80 ? 16 : 4;
    let i = 0;
    function tick() {
      if (i <= text.length) {
        d.textContent = text.slice(0, i++);
        scrollBot();
        if (i <= text.length) setTimeout(tick, speed);
        else setTimeout(drainPQueue, 20);
      }
    }
    tick();
  }
}
function showPrompt(label) {
  if (pBusy || pQueue.length > 0) {
    promptPending = label || currentPrompt();
  } else {
    _showPromptNow(label || currentPrompt());
  }
}
function _showPromptNow(label) {
  promptLbl.textContent = label;
  typedEl.textContent = '';
  inputEl.value = '';
  inputLine.style.display = '';
  scrollBot();
  inputEl.focus();
}
function clearPrompt() { inputLine.style.display = 'none'; }
function scrollBot() { requestAnimationFrame(() => { output.scrollTop = output.scrollHeight; }); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function loadBar(label, onDone, steps, delay) {
  steps = steps || 20; delay = delay || 60;
  const el = document.createElement('div');
  el.className = 'terminal-line load-bar';
  output.appendChild(el);
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = label + ' [' + '█'.repeat(i) + ' '.repeat(steps-i) + '] ' + (i*(100/steps)|0) + '%';
    scrollBot();
    if (++i > steps) { clearInterval(iv); if (onDone) onDone(); }
  }, delay);
}
function currentPrompt() {
  if (radioMode)    return '[radio] >';
  if (bbsMode)      return 'COMMAND >';

  return '/>';
}

// ── Matrix Rain ───────────────────────────────────────────────
let matrixActive = false;
function startMatrixRain() {
  if (matrixActive) return;
  matrixActive = true;
  const canvas = document.getElementById('matrix-canvas');
  canvas.style.display = '';
  const ctx = canvas.getContext('2d');
  const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*アァカサタナハマヤラワガザバ'.split('');
  const fz = 16;
  let drops = [];
  function setup() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    drops = Array.from({length: Math.floor(canvas.width/fz)}, () => Math.random()*canvas.height/fz);
  }
  setup();
  window.addEventListener('resize', setup);
  function draw() {
    if (!matrixActive) return;
    ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#0f0'; ctx.font=fz+'px monospace';
    drops.forEach((y,i) => {
      ctx.fillText(glyphs[Math.floor(Math.random()*glyphs.length)],i*fz,y*fz);
      if (y*fz>canvas.height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    });
    setTimeout(draw, 80);
  }
  draw();
}
function stopMatrixRain() {
  matrixActive = false;
  const canvas = document.getElementById('matrix-canvas');
  if (!canvas) return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}

function runTuneCommand() {
  const lines = [
    'TUNING TO HORIZON FREQUENCY 66.6...',
    '',
  ];
  const HIDDEN = ['THE ROAD ENDS HERE','MEMORY IS VOLATILE','THE NAME DID WORK','YOU ARE INSIDE ME','THE CORRIDOR WAS WARM','BONE LATTA LIVES'];
  const waveChars = '▁▂▃▄▅▆▇█▇▆▅▄▃▂▁';
  for (let i = 0; i < 14; i++) {
    let wave = '';
    for (let j = 0; j < 48; j++) {
      wave += waveChars[Math.floor(Math.random()*waveChars.length)];
    }
    lines.push(wave);
    if (i === 3 || i === 7 || i === 11) {
      const hidden = HIDDEN[Math.floor(Math.random()*HIDDEN.length)];
      const pad = Math.floor((48-hidden.length)/2);
      lines.push(' '.repeat(pad) + hidden);
    }
  }
  lines.push('');
  lines.push('[TRANSMISSION INCOMPLETE. FREQUENCY DRIFTING.]');
  lines.push('[Type \'abort\' to stop monitoring.]');

  let i = 0;
  function emit() {
    if (i >= lines.length) { showPrompt(currentPrompt()); return; }
    const l = lines[i++];
    const cls = (l.trim() && !l.startsWith('[') && !l.startsWith('TUNING')) ? 'tune-wave' : '';
    const hidden = HIDDEN.some(h => l.includes(h));
    printLine(esc(l), hidden ? 'tune-hidden' : cls, false);
    setTimeout(emit, 120);
  }
  emit();
}

  showPrompt(currentPrompt());

let matrix2Active = false;
function startMatrix2() {
  if (matrix2Active) return;
  matrix2Active = true;
  const canvas = document.getElementById('matrix-canvas-2');
  if (!canvas) return;
  canvas.style.display = '';
  const ctx = canvas.getContext('2d');
  const glyphs = '01アァカサタ'.split('');
  const fz = 22;
  let drops = [];
  function setup() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    drops = Array.from({length: Math.floor(canvas.width/fz)}, () => Math.random()*canvas.height/fz);
  }
  setup();
  function draw() {
    if (!matrix2Active) return;
    ctx.fillStyle = 'rgba(0,0,0,0.04)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#004400'; ctx.font = fz+'px monospace';
    drops.forEach((y,i) => {
      ctx.fillText(glyphs[Math.floor(Math.random()*glyphs.length)],i*fz,y*fz);
      if (y*fz>canvas.height && Math.random()>0.98) drops[i]=0;
      drops[i]++;
    });
    setTimeout(draw, 200);
  }
  draw();
}

const GLITCH_CHARS = '!@#$%^&*<>?/|\\~`';
let glitchIv = null;

  glitchIv = setInterval(() => {

    const lines = output.querySelectorAll('.terminal-line');
    if (!lines.length) return;
    const line = lines[Math.floor(Math.random() * Math.min(lines.length, 20))];
    if (!line || line.classList.contains('hughes-haunt') || line.children.length) return;
    const text = line.textContent;
    if (!text || text.length < 4) return;
    const idx = Math.floor(Math.random() * text.length);
    const orig = text[idx];
    const replacement = GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)];
    line.textContent = text.slice(0,idx) + replacement + text.slice(idx+1);
    setTimeout(() => { line.textContent = text; }, 120 + Math.random()*80);
  }, 4000 + Math.random()*3000);
}

// ── Late-session HH corruption ────────────────────────────────
function corruptText(text) {
  const mins = (Date.now() - sessionStart) / 60000;
  if (mins < 5) return text;
  const intensity = Math.min(0.25, (mins - 5) * 0.03);
  return text.split('').map(ch => {
    if (Math.random() < intensity && ch !== ' ' && ch !== '.') {
      return Math.random() < 0.5 ? ch.toUpperCase() : GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)];
    }
    return ch;
  }).join('');
}

const deskChartHistory = {};
function updateDeskChart(sym) {
  if (!deskChartHistory[sym]) deskChartHistory[sym] = [];
  deskChartHistory[sym].push(deskValues[sym]);
  if (deskChartHistory[sym].length > 16) deskChartHistory[sym].shift();
}
function renderDeskChart(sym) {
  const hist = deskChartHistory[sym];
  if (!hist || hist.length < 2) {
    const wc = '\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588';
    let w=''; for(let i=0;i<16;i++) w+=wc[Math.floor(Math.random()*wc.length)];
    return w;
  }
  const min = Math.min(...hist);
  const max = Math.max(...hist);
  const range = max - min || 1;
  const wc = '\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588'.split('');
  return hist.map(v => wc[Math.min(7, Math.floor(((v-min)/range)*7))]).join('');
}

  const prev = deskPrevValues[sym];

  if (prev === undefined) { deskPrevValues[sym] = curr; return ''; }
  if (curr > prev + 0.05)  { deskPrevValues[sym] = curr; return ' class="row-flash-up"'; }
  if (curr < prev - 0.05)  { deskPrevValues[sym] = curr; return ' class="row-flash-down"'; }
  return '';
}

    'https://feeds.npr.org/1001/rss.xml',
  ];
  const all = [];
  for (const url of sources) {
    try {
      const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
      if (!res.ok) continue;
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      const items = doc.querySelectorAll('item');
      items.forEach((item, i) => {
        if (i >= 12) return;
        const title = item.querySelector('title')?.textContent?.trim() || '';
        if (title) all.push(hrznVoice(title));
      });
    } catch(e) { /* try next source */ }
  }
  // Deduplicate and shuffle
  liveNews = [...new Set(all)].sort(() => Math.random() - 0.5);
}

async function fetchNewsSearch(term) {
  const clean = String(term || '').trim();
  if (!clean) return [];

  const rssUrl =
    'https://news.google.com/rss/search?q=' +
    encodeURIComponent(clean) +
    '&hl=en-US&gl=US&ceid=US:en';

  const all = [];

  try {
    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(rssUrl));
    if (!res.ok) throw new Error('RSS search failed: ' + res.status);

    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    const items = doc.querySelectorAll('item');

    items.forEach((item, i) => {
      if (i >= 24) return;
      const title = item.querySelector('title')?.textContent?.trim() || '';
      if (title) all.push(hrznVoice(title));
    });
  } catch(e) {
    // Fallback: search whatever global headlines are already loaded.
    const needle = clean.toUpperCase();
    if (Array.isArray(liveNews) && liveNews.length) {
      liveNews.forEach(h => {
        if (String(h).toUpperCase().includes(needle)) all.push(h);
      });
    }
  }

  return [...new Set(all)].slice(0, 24);
}

function hrznVoice(title) {
  return (title||'').toUpperCase()
    .replace(/['"]/g,'').replace(/\bSAYS?\b/g,':').replace(/\bREPORTS?\b/g,':')
    .replace(/\bACCORDING TO\b/g,'—').replace(/,/g,' /').replace(/\bTHE\b/g,'')
    .replace(/\s{2,}/g,' ').trim().slice(0, 76);
}

function getMoonPhase() {
  const jd = Date.now() / 86400000 + 2440587.5;
  let f = ((jd - 2451549.5) / 29.53058867) % 1;
  if (f < 0) f += 1;
  return ['NEW MOON','WAXING CRESCENT','FIRST QUARTER','WAXING GIBBOUS',
          'FULL MOON','WANING GIBBOUS','LAST QUARTER','WANING CRESCENT'][Math.round(f*8)%8];
}

// ── Wikipedia lookup ──────────────────────────────────────────
async function wikiLookup(query) {
  try {
    const base = 'https://en.wikipedia.org/w/api.php';

    // Step 1 — find best matching title
    const searchRes = await fetch(
      base + '?action=query&list=search&srsearch=' +
      encodeURIComponent(query) + '&format=json&origin=*&srlimit=3'
    );
    if (!searchRes.ok) return '[WIKI ERROR] Search request failed: ' + searchRes.status;
    const searchData = await searchRes.json();
    const hits = searchData?.query?.search;
    if (!hits || !hits.length) return '[WIKI] No results found for: ' + query;

    const title = hits[0].title;

    // Step 2 — fetch plain-text extract for that title
    const extractRes = await fetch(
      base + '?action=query&prop=extracts&exintro=true&explaintext=true' +
      '&exsentences=4&titles=' + encodeURIComponent(title) +
      '&format=json&origin=*'
    );
    if (!extractRes.ok) return '[WIKI ERROR] Extract request failed: ' + extractRes.status;
    const extractData = await extractRes.json();
    const pages = extractData?.query?.pages;
    if (!pages) return '[WIKI ERROR] No pages in response';
    const page = Object.values(pages)[0];
    if (!page || !page.extract) return '[WIKI ERROR] No extract for: ' + title;

    return formatWikiHRZN({ title: page.title, extract: page.extract }, query);
  } catch(e) { return '[WIKI ERROR] ' + e.message; }
}

function formatWikiHRZN(d, query) {
  const sentences = (d.extract || '').split(/(?<=[.!?])\s+/);
  const excerpt = sentences.slice(0, 3).join(' ').trim();

  // Light redaction pass
  let processed = excerpt;
  ['was born','died in','served as','appointed by','known for','became the'].forEach(t => {
    if (Math.random() < 0.35) processed = processed.replace(new RegExp(t, 'i'), '[REDACTED]');
  });

  const SEP = '\u2501'.repeat(38);
  return [
    '[WIKI CROSS-REFERENCE // PUBLIC RECORD]',
    SEP,
    'QUERY:   ' + query.toUpperCase(),
    'MATCH:   ' + d.title.toUpperCase(),
    '',
    processed,
    '',
    'SOURCE:  PUBLIC RECORD \u2014 UNCLASSIFIED',
    'NOTE:    Cross-reference HORIZON ARCHIVE for depth.',
    SEP,
    '[Ξ END CROSS-REFERENCE]',
  ].join('\n');
}

function makeBar(pct, width) {
  width = width || 10;
  const filled = Math.round((pct / 100) * width);
  return '[' + '▓'.repeat(filled) + '░'.repeat(width - filled) + ']';
}

function centerText(text, width) {
  width = width || 58;
  const s = String(text);
  const pad = Math.max(0, Math.floor((width - s.length) / 2));
  return ' '.repeat(pad) + s;
}

function toggleMayberry() {
  mayberryMode=!mayberryMode;
  if(mayberryMode){
    bbsMode = false;

    // ── Audio: fade in slowly like a TV warming up ──────────
    if (!mayberryTheme) {
      mayberryTheme = new Audio('./assets/audio/theme.mp3');
      mayberryTheme.loop = true;
      mayberryTheme.volume = 0;
    }
    mayberryTheme.currentTime = 0;
    mayberryTheme.play().catch(() => {});
    // Fade in over 3 seconds
    const fadeIn = setInterval(() => {
      if (mayberryTheme.volume < 0.05) {
        mayberryTheme.volume = Math.min(0.05, mayberryTheme.volume + 0.005);
      } else { clearInterval(fadeIn); }
    }, 150);

    // ── Video ───────────────────────────────────────────────
    const iframe = document.getElementById('mayberry-iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/MANrEcniveE?autoplay=1&rel=0&modestbranding=1';
    document.getElementById('mayberry-player').classList.add('visible');

    // ── Matrix bleeds red then goes white ───────────────────
    doChannelChange(() => {});
    const canvas = document.getElementById('matrix-canvas');
    canvas.style.filter = 'hue-rotate(120deg) saturate(2)';
    canvas.style.opacity = '0.45';
    setTimeout(() => {
      stopMatrixRain();
      canvas.style.filter = '';
      canvas.style.display = 'none';
    }, 500);

    // ── Red scanlines ───────────────────────────────────────
    if (!document.querySelector('.mayberry-scanlines')) {
      const sl = document.createElement('div');
      sl.className = 'mayberry-scanlines';
      terminal.appendChild(sl);
    }

    terminal.classList.add('mayberry-mode');
    virtualPath='/';

    // ── Static overlay and flash ────────────────────────────
    const overlay=document.createElement('div'); overlay.className='tv-static-overlay';
    const flash=document.createElement('div'); flash.className='mayberry-flash';
    flash.innerHTML='Welcome to Mayberry<span class="mayberry-opie">O.P.I.E.</span>';
    overlay.appendChild(flash); output.appendChild(overlay);
    setTimeout(()=>{overlay.remove();if(mayberryFirst){setTimeout(()=>{printLine('<b>@ntB:</b> Be careful, OP..');mayberryFirst=false;},700);}},3000);

    // ── Channel interference flickers every ~20s ────────────
    startMayberryInterference();
    startSubliminalCorruption();
    andyTurn = 0; andyMode = 'warm';

  } else {

    // ── VHS warble on exit ───────────────────────────────────
    terminal.classList.add('vhs-exit');
    setTimeout(() => terminal.classList.remove('vhs-exit'), 600);

    // ── Audio warble then fade out ───────────────────────────
    if (mayberryTheme) {
      // pitch warble via playbackRate
      mayberryTheme.playbackRate = 0.7;
      setTimeout(() => { if(mayberryTheme) mayberryTheme.playbackRate = 1.3; }, 100);
      setTimeout(() => { if(mayberryTheme) mayberryTheme.playbackRate = 1.0; }, 220);
      // then fade
      setTimeout(() => {
        const fadeOut = setInterval(() => {
          if (mayberryTheme && mayberryTheme.volume > 0.004) {
            mayberryTheme.volume = Math.max(0, mayberryTheme.volume - 0.004);
          } else {
            if(mayberryTheme){ mayberryTheme.pause(); mayberryTheme.currentTime=0; mayberryTheme.volume=0.05; }
            clearInterval(fadeOut);
          }
        }, 40);
      }, 300);
    }

    // ── Clean up ─────────────────────────────────────────────
    stopMayberryInterference();
    stopSubliminalCorruption();
    document.querySelectorAll('.mayberry-scanlines').forEach(e=>e.remove());
    closeMayberryPlayer();
    terminal.classList.remove('mayberry-mode');
    const canvas = document.getElementById('matrix-canvas');
    canvas.style.display=''; canvas.style.filter=''; canvas.style.opacity='0.28';
    startMatrixRain();
    document.querySelectorAll('.tv-static-overlay,.mayberry-flash').forEach(e=>e.remove());
    virtualPath='/';
  }
  showPrompt(currentPrompt());
}

  stopMayberryInterference();

}

  document.getElementById('mayberry-player').classList.remove('visible');
  const iframe = document.getElementById('mayberry-iframe');

}

function hhPick(arr) {
  if (!arr || !arr.length) return [];
  return arr[Math.floor(Math.random() * arr.length)];
}

function hhNormalize(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\s\-']/g, ' ').replace(/\s+/g, ' ').trim();
}

function hhDetectTopic(input, brain) {
  const lower = hhNormalize(input);
  let best = null;
  const topics = (brain && brain.topics) || {};

  for (const [topicName, topic] of Object.entries(topics)) {
    let score = 0;
    (topic.aliases || []).forEach(alias => {
      const a = hhNormalize(alias);
      if (!a) return;
      if (lower === a) score += a.length + 8;
      else if (lower.includes(a)) score += a.length;
    });
    if (score > 0 && (!best || score > best.score)) {
      best = { name: topicName, score, topic };
    }
  }
  return best;
}

function hhLooksLikeFollowup(input) {
  const lower = hhNormalize(input);
  return /^(why|how|more|continue|go on|tell me more|what about that|that|the room answer|the company answer|explain|again|what file|what room|who|where)$/.test(lower);
}

  const chance = hhSession.turns > 8 ? 0.28 : 0.16;
  if (brain.systemIntrusions && Math.random() < chance) out.push(hhPick(brain.systemIntrusions));
}

  }

  let detected = hhDetectTopic(clean, brain);
  if (!detected && hhLooksLikeFollowup(clean) && hhSession.lastTopic && brain.topics && brain.topics[hhSession.lastTopic]) {
    detected = { name: hhSession.lastTopic, topic: brain.topics[hhSession.lastTopic], score: 1 };

    const topic = detected.topic;

    if (detected.score > 10) hhSession.trust = Math.min(10, hhSession.trust + 1);

    if (topic.followups && Math.random() < 0.42) out.push(hhPick(topic.followups));

  if (lower === 'hh repo' || lower === 'repo') {
    printLine('repo index: partial', 'hughes-haunt');
    printLine('same name. different office. same racket.', 'hughes-haunt');
    printLine('file says family. movement says logistics.', 'hughes-haunt');

      '[HH HANDOFF PACKET]',
      'source: HORIZON TERMINAL',

    }).catch(() => {
      printText(packet, true);

  const heatVals = [72, 91, 64, 38, 88, 55, 67, 73];
  let heat = '<div style="font-size:11px;margin-bottom:10px;">'
    + '<div style="color:#554400;border-bottom:1px solid #332200;margin-bottom:4px">HEAT MATRIX</div>';
  DESK_HEAT.forEach((label, i) => {
    const noise = Math.floor((Math.random()-0.5)*6);
    const pct = Math.min(100, Math.max(0, heatVals[i] + noise));
    const filled = Math.round(pct / 5);
    const col = pct > 80 ? '#ff4400' : pct > 60 ? '#ffaa00' : '#447744';
    const bar = '█'.repeat(filled) + '░'.repeat(20 - filled);
    const labelPad = label.padEnd(26);
    heat += '<div style="display:flex;gap:6px;line-height:1.8;">'
      + '<span style="color:#443300;width:200px;flex-shrink:0">' + labelPad + '</span>'
      + '<span style="color:' + col + ';letter-spacing:0">' + bar + '</span>'
      + '<span style="color:' + col + ';margin-left:4px;width:36px">' + pct + '%</span>'
      + '</div>';
  });
  heat += '</div>';

  // ── LARGE ASCII CHART (watched symbol or NIX by default) ──────
  const chartSym = deskWatchSymbol || 'NIX';
  const chartInst = DESK_INSTRUMENTS[chartSym];
  const chartHist = deskChartHistory[chartSym] || [];
  const wc = '▁▂▃▄▅▆▇█'.split('');
  let bigChart = '';
  if (chartHist.length >= 2) {
    const min = Math.min(...chartHist);
    const max = Math.max(...chartHist);
    const range = max - min || 1;
    // Build 6-row ASCII chart
    const height = 5;
    const bars = chartHist.map(v => Math.min(height, Math.floor(((v-min)/range)*height)));
    let chartRows = '';
    for (let row = height; row >= 0; row--) {
      const axisVal = (min + (row/height)*range).toFixed(1);
      let line = '<div style="display:flex;gap:0;">'
        + '<span style="color:#443300;width:40px;text-align:right;margin-right:4px">' + axisVal + '</span>'
        + '<span style="color:#443300">│</span>';
      bars.forEach(b => {
        line += '<span style="color:' + (b >= row ? '#886600' : '#221100') + ';width:12px;text-align:center">'
          + (b >= row ? '█' : ' ') + '</span>';
      });
      line += '</div>';
      chartRows += line;
    }
    // X-axis
    chartRows += '<div style="color:#443300;margin-left:44px">'
      + '└' + '─'.repeat(Math.max(0, bars.length)) + '──── time</div>';
    bigChart = '<div style="font-size:10px;margin-bottom:10px;">'
      + '<div style="color:#554400;border-bottom:1px solid #332200;margin-bottom:4px">'
      + chartSym + ' — ' + chartInst.name + ' // ' + chartInst.signal + '</div>'
      + chartRows
      + '</div>';
  } else {
    bigChart = '<div style="font-size:10px;color:#443300;margin-bottom:10px;">'
      + chartSym + ' chart — accumulating data...</div>';
  }

  // ── CORRELATION MATRIX (mini) ─────────────────────────────────
  const corrPairs = [['NIX','DSRT'],['GLMR','CUBE'],['REDR','OPAL'],['FORD','TWA']];
  let corr = '<div style="font-size:10px;margin-bottom:10px;">'
    + '<div style="color:#554400;border-bottom:1px solid #332200;margin-bottom:4px">CORRELATION</div>';
  corrPairs.forEach(([a,b]) => {
    const va = deskValues[a] || 0;
    const vb = deskValues[b] || 0;
    const ratio = Math.min(1, Math.abs(va - vb) / 20);
    const corVal = (1 - ratio).toFixed(2);
    const col = parseFloat(corVal) > 0.7 ? '#886600' : '#443300';
    corr += '<div style="color:' + col + '">' + a + ' ↔ ' + b + '  r=' + corVal + '</div>';
  });
  corr += '</div>';

  // ── TAPE ─────────────────────────────────────────────────────
  if (Math.random() < 0.4) {
    const evt = TAPE_EVENTS[Math.floor(Math.random() * TAPE_EVENTS.length)];
    tapeBuffer.unshift(ts + '  ' + evt);
    if (tapeBuffer.length > 12) tapeBuffer.pop();
  }
  let tape = '<div style="font-size:10px;margin-bottom:10px;">'
    + '<div style="color:#554400;border-bottom:1px solid #332200;margin-bottom:4px">TAPE //</div>';
  tapeBuffer.slice(0,6).forEach((e,i) => {
    const col = i === 0 ? '#886600' : '#443300';
    tape += '<div style="color:' + col + '">' + esc(e) + '</div>';
  });
  tape += '</div>';

  // ── ALERTS ────────────────────────────────────────────────────
  const ALERTS = [
    'DESERT LEDGER OUT OF BALANCE',
    'NIXON FILE REQUESTED BY WRONG OFFICE',
    'SENSOR CHAIN REPORTING OLD SIGNAL',
    'GLMR DEEP WATER ECHO MISALIGNED',
    'RED ROCK LOAD EXCEEDS SAFE CONTINUITY RANGE',
  ];
  let alerts = '<div style="font-size:10px;margin-bottom:10px;">'
    + '<div style="color:#554400;border-bottom:1px solid #332200;margin-bottom:4px">ALERTS</div>';
  ALERTS.forEach(a => {
    const col = Math.random() < 0.4 ? '#ff4400' : '#663300';
    alerts += '<div style="color:' + col + '">⚠ ' + a + '</div>';
  });
  alerts += '</div>';

  // ── LAYOUT ────────────────────────────────────────────────────
  return '<div style="font-family:Consolas,Monaco,monospace;line-height:1.5;color:#ffcc44;">'
    + header
    + ticker
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">'
    + '<div>' + bigChart + corr + '</div>'
    + '<div>' + heat + '</div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;">'
    + '<div>' + tape + '</div>'
    + '<div>' + alerts + '</div>'
    + '</div>'
    + '<div style="color:#332200;font-size:10px;margin-top:8px;border-top:1px solid #221100;padding-top:4px">'
    + 'watch [sym] | trade [sym] | halt [sym] | margin call | tape | alerts | heat | portfolio | quit'
    + '</div>'
    + '</div>';
}

function handleDeskCommand(cmd) {
  const lower = cmd.trim().toLowerCase();
  printLine(esc('> ' + cmd), '', true);
  const setDesk = (view, focus) => {
    deskUseLegacyFallback = false;
    wabashDeskView = view || 'home';
    wabashDeskFocus = focus || '';
    wdlsDeskUpdate();
    showPrompt('[desk] >');
  };

  if (lower === 'quit' || lower === 'exit' || lower === 'exit desk') { exitDeskMode(); return; }
  if (['reload','refresh','json reload','reload json'].includes(lower)) {
    wabashDeskCore = null; deskUseLegacyFallback = false; wabashDeskView = 'home'; wabashDeskFocus = ''; loadWabashDeskCore(true); wdlsDeskUpdate(); showPrompt('[desk] >'); return;
  }
  if (lower === 'legacy' || lower === 'legacy desk') { deskUseLegacyFallback = true; wdlsDeskUpdate(); showPrompt('[desk] >'); return; }

  // WCG / Global Reach command set
  if (['help','desk help','home','menu','county','wcg','reach','global','combine','market'].includes(lower)) return setDesk('home');
  if (['emperor','emperor terminal','basileia','register','imperial register'].includes(lower)) return setDesk('emperor');
  if (['sectors','sector board','global sectors'].includes(lower)) return setDesk('sectors');
  if (lower.startsWith('sector ')) return setDesk('sectors', lower.replace(/^sector\s+/, '').trim());
  if (['entities','entity','tickers','ticker','companies','businesses','instruments'].includes(lower)) return setDesk('entities');
  if (lower.startsWith('entity ')) return setDesk('entities', lower.replace(/^entity\s+/, '').trim());
  if (lower.startsWith('ticker ')) return setDesk('entities', lower.replace(/^ticker\s+/, '').trim());
  if (['valley','nodes','node map','rings','river valley'].includes(lower)) return setDesk('valley');
  if (lower.startsWith('node ')) return setDesk('valley', lower.replace(/^node\s+/, '').trim());
  if (lower.startsWith('town ')) return setDesk('valley', lower.replace(/^town\s+/, '').trim());
  if (['ledger','budget','budget county','county ledger','taxrank','tax rank','taxpayer','taxpayer stack','tax'].includes(lower)) return setDesk('ledger');
  if (['wire','signals','signal','rumor','rumors','notices','notice','news','public wire','signal wire'].includes(lower)) return setDesk('wire');
  if (['archive','ghosts','ghost nodes','memory','archive damage'].includes(lower)) return setDesk('archive');
  if (['path','paths','path index','trace'].includes(lower)) return setDesk('paths');
  if (lower.startsWith('path ')) return setDesk('paths', lower.replace(/^path\s+/, '').trim());
  if (['sacred','sacred register'].includes(lower)) return setDesk('sacred');
  if (['abrahamic','abrahamic combine'].includes(lower)) return setDesk('sacred', 'abrahamic');
  if (['christendom','christendom combine'].includes(lower)) return setDesk('sacred', 'christendom');
  if (['rome','roman','roman register','catholic','catholic register'].includes(lower)) return setDesk('sacred', 'rome');
  if (['byzantium','orthodox','byzantine','byzantine table'].includes(lower)) return setDesk('sacred', 'byzantium');
  if (['mecca','islam','islamic','mecca vector'].includes(lower)) return setDesk('sacred', 'mecca');
  if (['covenant','jewish','judaism','jerusalem','jerusalem axis'].includes(lower)) return setDesk('sacred', lower.includes('jerusalem') ? 'jerusalem' : 'covenant');
  if (['denominations','denoms','religions','rank religions','rank denominations'].includes(lower)) return setDesk('denominations');
  if (['numbers','sacred numbers','catholic numbers'].includes(lower)) return setDesk('numbers');
  if (['sources','source','source registry'].includes(lower)) return setDesk('sources');
  if (lower === 'radio' || lower === 'radio relay') return setDesk('radio');

  // Legacy fictional market commands retained for old desk mode.
  if (lower.startsWith('watch ')) {
    const sym = lower.slice(6).trim().toUpperCase();
    if (DESK_INSTRUMENTS[sym]) { deskWatchSymbol = sym; printLine('watching: ' + sym, '', true); }
    else { const ent = wcgFindEntity(sym); if (ent) setDesk('entities', sym); else printLine('unknown symbol: ' + sym, '', true); }
    showPrompt('[desk] >'); return;
  }
  if (lower === 'watch') { deskWatchSymbol = null; printLine('watch cleared.', '', true); showPrompt('[desk] >'); return; }
  if (lower === 'tape') { tapeBuffer.slice(0, 5).forEach(l => printLine(esc(l), 'uplink-line', true)); showPrompt('[desk] >'); return; }
  if (lower === 'heat') { setDesk('sectors'); return; }
  if (lower === 'alerts') { setDesk('wire'); return; }
  if (lower === 'portfolio') { setDesk('entities'); return; }

  printLine('unknown desk command. try: wcg, sectors, entities, entity honeywell, sacred, denominations, path, wire, archive, quit.', '', true);
  showPrompt('[desk] >');
}

function startWireFeed(type) {
  clearInterval(wireIv);
  const events = WIRE_FEEDS[type] || WIRE_FEEDS.default;
  function emit() {
    if (!wireMode) return;
    const now = new Date();
    const ts = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    let evt;
    if (type === 'news') {
      // News-only feed — all real headlines
      evt = liveNews.length > 0
        ? '[GLOBAL WIRE] ' + liveNews[Math.floor(Math.random() * liveNews.length)]
        : '[GLOBAL WIRE] NO SIGNAL — FEED UNREACHABLE';
    } else if (type === 'default' && liveNews.length > 0 && Math.random() < 0.65) {
      // Default feed — 65% real headlines, 35% fictional HRZN events
      evt = '[GLOBAL WIRE] ' + liveNews[Math.floor(Math.random() * liveNews.length)];
    } else {
      evt = '[HRZN INTERNAL] ' + events[Math.floor(Math.random() * events.length)];
    }
    printLine(esc(ts + '  ' + evt), 'uplink-line');
    capOutput();
  }
  emit();
  wireIv = setInterval(emit, 3800 + Math.random() * 2000);
}

function startWireSearchFeed(term, results) {
  clearInterval(wireIv);

  const clean = String(term || '').trim();
  const label = clean.toUpperCase();
  const headlines = Array.isArray(results) ? results : [];
  const internal = topicInternalSignals(clean);

  function emit() {
    if (!wireMode) return;

    const now = new Date();
    const ts = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

    if (headlines.length && Math.random() < 0.72) {

  }

  if (lower.startsWith('search ') || lower.startsWith('find ') || lower.startsWith('lookup ')) {
    const term = raw.replace(/^(search|find|lookup)\s+/i, '').trim();
    retuneWireSearch(term);
    return;
  }

  if (lower.startsWith('wire ')) {
    const topic = lower.replace(/^wire\s+/, '').trim();

    if (!topic) {
      printWireFeeds();
      showPrompt('[wire] >'); return;
    }

    if (WIRE_FEEDS[topic]) {
      startWireFeed(topic);
      printLine('switching to internal feed: ' + topic, 'uplink-line', true);
      showPrompt('[wire] >'); return;
    }

    retuneWireSearch(raw.replace(/^wire\s+/i, '').trim());
    return;
  }

  if (WIRE_FEEDS[lower]) {
    startWireFeed(lower);
    printLine('switching to internal feed: ' + lower, 'uplink-line', true);
    showPrompt('[wire] >'); return;
  }

  // Direct keyword fallback: in Wire Room, any normal phrase becomes a live search retune.
  if (/^[a-z0-9][a-z0-9 .,'&:;\/\-]{1,80}$/i.test(raw)) {
    retuneWireSearch(raw);
    return;
  }

  printLine('unknown wire command. type HELP, FEEDS, NEWS, SEARCH [term], or EXIT.', 'signal-bleed', true);
  showPrompt('[wire] >');
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = inputEl.value.trim();
    inputEl.value = ''; typedEl.textContent = '';
    if (!cmd) { showPrompt(currentPrompt()); return; }
    // History
    if (cmdHistory[cmdHistory.length-1] !== cmd) cmdHistory.push(cmd);
    if (cmdHistory.length > 100) cmdHistory.shift();
    historyIndex = -1;
    // Route
    if (state.phase==='login_user'||state.phase==='login_pass') handleLogin(cmd);
    else if (hhMode) handleHHCommand(cmd);
    else if (deskMode) handleDeskCommand(cmd);
    else if (radioMode) handleRadioCommand(cmd);
    else if (wireMode) handleWireCommand(cmd);
    else if (switchMode) handleSwitchCommand(cmd);
    else if (microMode) handleMicroCommand(cmd);
    else if (tapeRepairMode) handleTapeCommand(cmd);
    // Mayberry is a full-screen channel mode. Route it through the main handler
    // before BBS so Opie/Mayberry probes do not get swallowed by the civic menu.
    else if (mayberryMode) handleCommand(cmd);
    else if (bbsMode) handleBBSCommand(cmd);
    else if (state.phase==='terminal') handleCommand(cmd);
  }
  else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (cmdHistory.length === 0) return;
    if (historyIndex === -1) historyIndex = cmdHistory.length - 1;
    else if (historyIndex > 0) historyIndex--;
    inputEl.value = cmdHistory[historyIndex];
    typedEl.textContent = inputEl.value;
    setTimeout(() => inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length), 0);
  }
  else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex === -1) return;
    historyIndex++;
    if (historyIndex >= cmdHistory.length) { historyIndex = -1; inputEl.value = ''; typedEl.textContent = ''; }
    else { inputEl.value = cmdHistory[historyIndex]; typedEl.textContent = inputEl.value; }
  }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const partial = inputEl.value.toLowerCase();
    if (!partial) return;
    // Check commands first
    const match = ALL_COMMANDS.find(c => c.startsWith(partial));
    if (match) { inputEl.value = match; typedEl.textContent = match; return; }
    // Check VFS
    const vfsList = VFS[virtualPath] || [];
    const fmatch = vfsList.find(f => f.toLowerCase().startsWith(partial.replace(/^(cat |open |cd )/,'')));
    if (fmatch) {
      const prefix = partial.match(/^(cat |open |cd )/)?.[0] || '';
      inputEl.value = prefix + fmatch; typedEl.textContent = inputEl.value;
    }
  }
});
inputEl.addEventListener('input', ()=>{ typedEl.textContent=inputEl.value; });
document.addEventListener('click', ()=>inputEl.focus());
